name: 🚀 Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.9
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
        pip install -r requirements.txt
        
    - name: Run tests
      run: |
        python test_verification.py
        
    - name: Extract tag name
      id: tag
      run: echo "tag=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT
      
    - name: Build package
      run: |
        python -m build
        
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        release_name: TTT-MAE ${{ steps.tag.outputs.tag }}
        body: |
          ## Changes in ${{ steps.tag.outputs.tag }}
          
          ### New Features
          - List new features here
          
          ### Bug Fixes  
          - List bug fixes here
          
          ### Performance Improvements
          - List performance improvements here
          
          ### Documentation
          - List documentation updates here
          
          ### Dependencies
          - List dependency updates here
          
          ## Installation
          
          ```bash
          git clone https://github.com/username/MAE_TTT_WaveDS.git
          cd MAE_TTT_WaveDS
          pip install -r requirements.txt
          ```
          
          ## Verification
          
          ```bash
          python test_verification.py
          ```
          
          For detailed usage instructions, see the [README](README.md).
        draft: false
        prerelease: false
        
    - name: Upload Release Assets
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./dist/*
        asset_name: ttt-mae-${{ steps.tag.outputs.tag }}.tar.gz
        asset_content_type: application/gzip
