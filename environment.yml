name: ttt-mae
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  - python>=3.9,<3.11
  
  # Core Deep Learning
  - pytorch>=2.0.0
  - torchvision>=0.15.0
  - pytorch-cuda=11.8  # For CUDA support (remove if using CPU/MPS only)
  
  # Computer Vision and ML
  - timm>=0.6.0
  - pillow>=9.0.0
  
  # Scientific Computing
  - numpy>=1.21.0
  - scipy>=1.7.0
  - scikit-learn>=1.0.0
  
  # Data Visualization
  - matplotlib>=3.5.0
  
  # Data I/O
  - h5py>=3.7.0
  
  # Development Tools
  - tensorboard>=2.8.0
  - tqdm>=4.60.0
  - jupyter
  - ipykernel
  
  # Optional Development Dependencies
  - pytest>=7.0.0
  - mypy>=0.950
  
  # pip-only dependencies
  - pip
  - pip:
    - timm  # Latest timm version from PyPI
    
# Usage:
# conda env create -f environment.yml
# conda activate ttt-mae
